            }

            return (

                    alt={alt} 
                    onError={() => setHasError(true)}
                    className={className}

        function BackToTop() {
            const [visible, setVisible] = useState(false);
            useEffect(() => {
                const toggleVisible = () => {
                    if (window.pageYOffset > 300) setVisible(true);
                    else setVisible(false);
                };
                window.addEventListener('scroll', toggleVisible);
                return () => window.removeEventListener('scroll', toggleVisible);
            }, []);

            const scrollToTop = () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            return (
                visible && (
                    <button onClick={scrollToTop} className="fixed bottom-6 right-6 z-40 bg-peachAccent text-white w-12 h-12 rounded-full shadow-lg flex items-center justify-center hover:bg-opacity-90 transition transform hover:scale-110">

                    )}
                </div>
            );
        }

        function GalleryPage() {
            const [filter, setFilter] = useState('All');
            const categories = ['All', 'Dogs', 'Cats', 'Rabbits', 'Birds'];

            const filteredGallery = filter === 'All' ? galleryData : galleryData.filter(item => item.category === filter);

            return (
                <div className="space-y-12 py-12 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                    <div className="text-center max-w-3xl mx-auto space-y-4">
                        <span className="text-peachAccent font-semibold text-sm uppercase tracking-wider">Visual Moments 📸</span>
                        <h1 className="text-4xl font-bold text-slate-900">Pet Gallery 🐶🐱🐰🐦</h1>
                        <p className="text-slate-600 text-lg">A visual celebration of rescue joy, peaceful slumbers, and playful spirit.</p>
                    </div>

                    <div className="flex flex-wrap gap-2 justify-center">
                        {categories.map(cat => (
                            <button
                                key={cat}
                                onClick={() => setFilter(cat)}
                                className={`px-6 py-2 rounded-full font-medium text-sm transition ${filter === cat ? 'bg-peachAccent text-white shadow-sm' : 'bg-white text-slate-700 border border-orange-100 hover:bg-orange-50'}`}
                            >
                                {cat}
                            </button>
                        ))}
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-8">
                        {filteredGallery.map(item => (
                            <div key={item.id} className="group relative rounded-3xl overflow-hidden shadow-sm bg-white border border-orange-100 h-80 bg-orange-50">
                                <SafeImage 
                                    src={item.image} 
                                    alt={item.title} 
                                    fallbackBg={item.fallbackBg}
                                    icon={item.icon}
                                    className="w-full h-full object-cover group-hover:scale-110 transition duration-500"
                                />
                                <div className="absolute inset-0 bg-gradient-to-t from-slate-900/80 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition duration-300 flex flex-col justify-end p-6">
                                    <span className="text-peachAccent text-xs font-semibold uppercase tracking-wider">{item.category}</span>
                                    <h3 className="text-white text-xl font-bold">{item.title}</h3>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function CarePage() {
            const [activeGuide, setActiveGuide] = useState(null);

            return (
                <div className="space-y-12 py-12 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                    <div className="text-center max-w-3xl mx-auto space-y-4">
                        <span className="text-peachAccent font-semibold text-sm uppercase tracking-wider">Expert Knowledge 🩺</span>
                        <h1 className="text-4xl font-bold text-slate-900">Pet Care Guides 🐾</h1>
                        <p className="text-slate-600 text-lg leading-relaxed">Scientifically grounded, universally correct advice to ensure your companion lives a long, healthy, and joyous life.</p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                        {careGuidesData.map(guide => (
                            <div key={guide.id} className={`bg-white p-8 rounded-3xl shadow-sm border ${guide.border} space-y-4 flex flex-col justify-between`}>
                                <div className="space-y-4">
                                    <div className={`w-14 h-14 ${guide.color} rounded-2xl flex items-center justify-center text-2xl font-bold`}>
                                        <i className={`fa-solid ${guide.icon}`}></i>
                                    </div>
                                    <h3 className="text-2xl font-bold text-slate-900">{guide.title}</h3>
                                    <p className="text-slate-600 text-sm leading-relaxed">{guide.summary}</p>
                                </div>
                                <button 
                                    onClick={() => setActiveGuide(guide)}
                                    className="pt-4 border-t border-orange-100 flex items-center text-peachAccent text-sm font-semibold cursor-pointer hover:underline w-full text-left"
                                >
                                    <span>Read Full Guide ✨</span>
                                    <i className="fa-solid fa-arrow-right ml-2 text-xs"></i>
                                </button>
                            </div>
                        ))}
                    </div>

                    {activeGuide && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40 backdrop-blur-xs">
                            <div className="bg-white rounded-3xl max-w-2xl w-full p-8 shadow-2xl border border-orange-100 space-y-6 relative max-h-[90vh] overflow-y-auto">
                                <button 
                                    onClick={() => setActiveGuide(null)}
                                    className="absolute top-4 right-4 bg-orange-50 hover:bg-orange-100 text-slate-700 w-10 h-10 rounded-full flex items-center justify-center transition"
                                >
                                    <i className="fa-solid fa-xmark text-lg"></i>
                                </button>

                                <div className="flex items-center space-x-4">
                                    <div className={`w-14 h-14 ${activeGuide.color} rounded-2xl flex items-center justify-center text-2xl font-bold shrink-0`}>
                                        <i className={`fa-solid ${activeGuide.icon}`}></i>
                                    </div>
                                    <div>
                                        <span className="text-xs font-semibold uppercase text-peachAccent tracking-wider">PawHaven Care Guide 🩺</span>
                                        <h2 className="text-2xl font-bold text-slate-900">{activeGuide.title}</h2>
                                    </div>
                                </div>

                                <div className="space-y-4 text-slate-600 text-sm leading-relaxed border-t border-orange-100 pt-4">
                                    <p className="font-medium text-slate-800 text-base">{activeGuide.summary}</p>
                                    <p>{activeGuide.details}</p>
                                    <div className="bg-peachSoft/40 p-4 rounded-2xl border border-orange-100 text-xs text-slate-700">
                                        <i className="fa-solid fa-lightbulb text-peachAccent mr-2 text-sm"></i>
                                        <strong>Pro Tip:</strong> Always consult your primary veterinarian for personalized recommendations tailored specifically to your pet's age, breed, and medical history.
                                    </div>
                                </div>

                                <button 
                                    onClick={() => setActiveGuide(null)}
                                    className="w-full bg-peachAccent text-white py-3 rounded-2xl font-medium hover:bg-opacity-90 transition shadow-sm"
                                >
                                    Close Guide 🐾
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function ContactPage() {
            const [submitted, setSubmitted] = useState(false);
            const [form, setForm] = useState({ name: '', email: '', subject: '', message: '' });

            const handleSubmit = (e) => {
                e.preventDefault();
                setSubmitted(true);
            };

            return (
                <div className="space-y-12 py-12 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                    <div className="text-center max-w-3xl mx-auto space-y-4">
                        <span className="text-peachAccent font-semibold text-sm uppercase tracking-wider">We're Here For You 💌</span>
                        <h1 className="text-4xl font-bold text-slate-900">Contact PawHaven</h1>
                        <p className="text-slate-600 text-lg">Have questions about adoption, volunteering, or animal care? Reach out anytime.</p>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-12">
                        <div className="lg:col-span-5 space-y-8">
                            <div className="bg-white p-8 rounded-3xl border border-orange-100 shadow-sm space-y-6">
                                <h3 className="text-2xl font-bold text-slate-900">Get in Touch 🏡</h3>
                                <div className="space-y-6">
                                    <div className="flex items-start space-x-4">
                                        <div className="w-12 h-12 bg-peachSoft text-peachAccent rounded-2xl flex items-center justify-center text-xl shrink-0">
                                            <i className="fa-solid fa-location-dot"></i>
                                        </div>
                                        <div>
                                            <h4 className="font-bold text-slate-900">Sanctuary Location 📍</h4>
                                            <p className="text-slate-600 text-sm mt-0.5">123 Paws Avenue, Rescue District, San Francisco, CA 94107</p>
                                        </div>
                                    </div>
                                    <div className="flex items-start space-x-4">
                                        <div className="w-12 h-12 bg-mintSoft text-mintAccent rounded-2xl flex items-center justify-center text-xl shrink-0">
                                            <i className="fa-solid fa-envelope"></i>
                                        </div>
                                        <div>
                                            <h4 className="font-bold text-slate-900">Email Address 📧</h4>
                                            <p className="text-slate-600 text-sm mt-0.5">support@pawhaven.org</p>
                                        </div>
                                    </div>
                                    <div className="flex items-start space-x-4">
                                        <div className="w-12 h-12 bg-lavenderSoft text-lavenderAccent rounded-2xl flex items-center justify-center text-xl shrink-0">
                                            <i className="fa-solid fa-phone"></i>
                                        </div>
                                        <div>
                                            <h4 className="font-bold text-slate-900">Phone Support 📞</h4>
                                            <p className="text-slate-600 text-sm mt-0.5">+1 (555) 345-PAWS</p>
                                        </div>
                                    </div>
                                </div>

                                <div className="pt-6 border-t border-orange-100">
                                    <h4 className="font-bold text-slate-900 mb-4">Follow Our Journey ✨</h4>
                                    <div className="flex space-x-4">
                                        <a href="#" className="w-10 h-10 bg-peachSoft text-peachAccent rounded-full flex items-center justify-center hover:bg-peachAccent hover:text-white transition"><i className="fa-brands fa-facebook-f"></i></a>
                                        <a href="#" className="w-10 h-10 bg-peachSoft text-peachAccent rounded-full flex items-center justify-center hover:bg-peachAccent hover:text-white transition"><i className="fa-brands fa-instagram"></i></a>
                                        <a href="#" className="w-10 h-10 bg-peachSoft text-peachAccent rounded-full flex items-center justify-center hover:bg-peachAccent hover:text-white transition"><i className="fa-brands fa-twitter"></i></a>
                                        <a href="#" className="w-10 h-10 bg-peachSoft text-peachAccent rounded-full flex items-center justify-center hover:bg-peachAccent hover:text-white transition"><i className="fa-brands fa-youtube"></i></a>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="lg:col-span-7">
                            <div className="bg-white p-8 sm:p-10 rounded-3xl border border-orange-100 shadow-sm">
                                <h3 className="text-2xl font-bold text-slate-900 mb-2">Send Us a Message 💌</h3>
                                <p className="text-slate-600 text-sm mb-6">Fill out the form below and our team will respond warmly and promptly.</p>

                                {submitted ? (
                                    <div className="bg-mintSoft border border-emerald-200 text-emerald-900 p-8 rounded-2xl text-center space-y-3">
                                        <div className="text-4xl text-mintAccent"><i className="fa-solid fa-circle-check"></i></div>
                                        <h4 className="font-bold text-xl">Message Sent Successfully! 🎉</h4>
                                        <p className="text-sm text-emerald-800">Thank you for connecting with PawHaven. We have received your note and will be in touch shortly.</p>
                                        <button 
                                            onClick={() => setSubmitted(false)}
                                            className="mt-4 bg-mintAccent text-white px-6 py-2.5 rounded-xl text-sm font-medium"
                                        >
                                            Send Another Message 🐾
                                        </button>
                                    </div>
                                ) : (
                                    <form onSubmit={handleSubmit} className="space-y-4">
                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                            <div>
                                                <label className="block text-xs font-semibold text-slate-700 mb-1">Your Name *</label>
                                                <input 
                                                    type="text" 
                                                    required 
                                                    placeholder="John Doe"
                                                    value={form.name}
                                                    onChange={e => setForm({...form, name: e.target.value})}
                                                    className="w-full px-4 py-3 rounded-xl bg-orange-50/50 border border-orange-100 text-sm focus:outline-none focus:ring-1 focus:ring-peachAccent"
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-semibold text-slate-700 mb-1">Your Email *</label>
                                                <input 
                                                    type="email" 
                                                    required 
                                                    placeholder="john@example.com"
                                                    value={form.email}
                                                    onChange={e => setForm({...form, email: e.target.value})}
                                                    className="w-full px-4 py-3 rounded-xl bg-orange-50/50 border border-orange-100 text-sm focus:outline-none focus:ring-1 focus:ring-peachAccent"
                                                />
                                            </div>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-700 mb-1">Subject *</label>
                                            <input 
                                                type="text" 
                                                required 
                                                placeholder="Adoption Question / Volunteering"
                                                value={form.subject}
                                                onChange={e => setForm({...form, subject: e.target.value})}
                                                className="w-full px-4 py-3 rounded-xl bg-orange-50/50 border border-orange-100 text-sm focus:outline-none focus:ring-1 focus:ring-peachAccent"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-700 mb-1">Message *</label>
                                            <textarea 
                                                required 
                                                rows="5"
                                                placeholder="How can we help you?"
                                                value={form.message}
                                                onChange={e => setForm({...form, message: e.target.value})}
                                                className="w-full px-4 py-3 rounded-xl bg-orange-50/50 border border-orange-100 text-sm focus:outline-none focus:ring-1 focus:ring-peachAccent"
                                            ></textarea>
                                        </div>
                                        <button 
                                            type="submit" 
                                            className="w-full bg-peachAccent text-white py-3.5 rounded-xl font-medium hover:bg-opacity-95 transition shadow-sm"
                                        >
                                            Send Message 🐾
                                        </button>
                                    </form>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function App() {
            const [currentTab, setCurrentTab] = useState('home');
            const [selectedPet, setSelectedPet] = useState(null);

            useEffect(() => {
                window.scrollTo(0, 0);
            }, [currentTab]);

            return (
                <div className="min-h-screen flex flex-col font-poppins bg-canvasBg text-slate-700">
                    <Navbar currentTab={currentTab} setCurrentTab={setCurrentTab} />

                    <main className="flex-1">
                        {currentTab === 'home' && <HomePage setCurrentTab={setCurrentTab} onSelectPet={(pet) => setSelectedPet(pet)} />}
                        {currentTab === 'about' && <AboutUs />}
                        {currentTab === 'adopt' && <AdoptPage selectedPet={selectedPet} onClearSelectedPet={() => setSelectedPet(null)} />}
                        {currentTab === 'gallery' && <GalleryPage />}
                        {currentTab === 'care' && <CarePage />}
                        {currentTab === 'contact' && <ContactPage />}
                    </main>

                    <Footer setCurrentTab={setCurrentTab} />
                    <BackToTop />
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
